<footer>
  <div class="footer-wrap">
    <div class="footer-tagline">
      <p>{{ site.data.settings.footer }}</p>
    </div>
    <div class="social-media">
      <nav>
        {% for item in site.data.settings.social %}
          <a href="{{ item.link }}" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
        {% endfor %}
      </nav>
    </div>
    <!-- Add Copyright Notice Below -->
    <div class="copyright">
      <p>© 2025 Bjarne Liveyns. All rights reserved. Images and content are protected by copyright law.</p>
    </div>
  </div>
</footer>
