<header>
  <div class="logo">
    <a href="{{ site.github.url }}/">
      {{ site.title }}
    </a>
  </div>
  <div class="logo">
        <img src="{{ site.github.url }}/favicon.ico" alt="Site Icon" class="site-icon">  
  </div>
  <nav>
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
